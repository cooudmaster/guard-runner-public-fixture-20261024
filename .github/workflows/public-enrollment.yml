name: Proof Fabric attested Node fixture
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: GitHub-hosted Ubuntu or a single admitted disposable VM label
        type: string
        default: ubuntu-24.04
permissions: {}
jobs:
  node_artifact:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use fixed Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      - name: Run synthetic contract
        run: npm ci --ignore-scripts && npm test
      - name: Produce deterministic output
        run: node -e "require('node:fs').writeFileSync('output.txt', 'fixture-result-v1\n')"
      - name: Attest output using GitHub identity
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: output.txt
          show-summary: true
          push-to-registry: false
          create-storage-record: false
      - name: Preserve output and public verification bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -f "$ATTESTATION_BUNDLE"
          mkdir proof
          cp -- output.txt proof/output.txt
          cp -- "$ATTESTATION_BUNDLE" proof/attestation.json
      - name: Upload public evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-proof
          path: proof/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
