name: Synthetic real browser
on:
  workflow_dispatch:
    inputs:
      runner_labels:
        type: string
        default: '{}'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ${{ fromJSON(inputs.runner_labels || '{}').browser || 'ubuntu-latest' }}
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright@sha256:b27e719ecbfef153e13fd24e8341736733bf2658b229677eb21ff57ff5d7fb29
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned browser client
        run: npm ci --ignore-scripts
      - name: Exercise real Chromium
        run: node browser.cjs
      - name: Save browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-evidence
          path: |
            browser.json
            browser.png
          retention-days: 1
