name: Synthetic Node DAG matrix reusable
on:
  workflow_dispatch:
    inputs:
      runner_labels:
        type: string
        default: '{}'
permissions:
  contents: read
jobs:
  node:
    runs-on: ${{ fromJSON(inputs.runner_labels || '{}').node || 'ubuntu-latest' }}
    outputs:
      digest: ${{ steps.receipt.outputs.digest }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: npm install and test
        run: npm ci && npm test
      - name: Produce output
        id: receipt
        run: |
          printf 'fixture-result-v1\n' > output.txt
          echo "digest=$(sha256sum output.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Save exact output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-output
          path: output.txt
          retention-days: 1
  matrix:
    needs: node
    strategy:
      fail-fast: false
      matrix:
        variant: [alpha, beta]
    runs-on: ${{ fromJSON(inputs.runner_labels || '{}')[matrix.variant] || 'ubuntu-latest' }}
    steps:
      - name: Download parent output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: node-output
      - name: Assert needs output and matrix
        env:
          EXPECTED_DIGEST: ${{ needs.node.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
        run: |
          test "$VARIANT" = alpha || test "$VARIANT" = beta
          test "$(sha256sum output.txt | cut -d ' ' -f 1)" = "$EXPECTED_DIGEST"
          test "$(cat output.txt)" = fixture-result-v1
  reusable:
    needs: matrix
    uses: ./.github/workflows/reusable.yml
    with:
      runner_label: ${{ fromJSON(inputs.runner_labels || '{}').reusable || 'ubuntu-latest' }}
